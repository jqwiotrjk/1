<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>야간 미술관: 밍의 아카이브 (10분 회상판) | Ritming Fan Game</title>
<style>
  :root {
    --bg: #0b0a10;
    --panel: #15131f;
    --panel-2: #1f1c2e;
    --border: #433a63;
    --rose: #e89ac7;
    --cream: #f6efe9;
    --muted: #afa4c9;
    --gold: #e7c26b;
  }

  * {
    box-sizing: border-box;
    user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 20% 15%, rgba(143, 72, 104, 0.16), transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(92, 74, 145, 0.16), transparent 45%),
      var(--bg);
    color: var(--cream);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 18px 14px 36px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    background: var(--panel);
    border: 2px solid var(--border);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    padding: 13px 18px;
  }

  .title-area {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 0.4px;
    color: var(--rose);
    background: rgba(232, 154, 199, 0.12);
    border: 1px solid rgba(232, 154, 199, 0.38);
    padding: 4px 9px;
    border-radius: 999px;
  }

  .title {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
  }

  .reset-btn {
    background: var(--panel-2);
    color: var(--cream);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .reset-btn:hover {
    border-color: var(--rose);
    background: #2b2640;
  }

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    background: var(--panel-2);
    border-left: 2px solid var(--border);
    border-right: 2px solid var(--border);
    padding: 9px 18px;
    font-size: 13.5px;
    color: var(--muted);
    font-weight: 700;
  }

  .status-bar strong {
    color: var(--cream);
  }

  .live-pill {
    color: #ff7b9c;
  }

  .live-pill.off {
    color: var(--muted);
  }

  .screen-box {
    position: relative;
    background: #100e18;
    border: 2px solid var(--border);
    border-radius: 0 0 10px 10px;
    overflow: hidden;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
  }

  #scene {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
  }

  #msg-box {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 18px;
    min-height: 132px;
    background: rgba(14, 12, 22, 0.96);
    border: 2px solid #9d86c9;
    border-radius: 6px;
    padding: 14px 18px;
    display: none;
    flex-direction: column;
    justify-content: space-between;
    z-index: 20;
  }

  #msg-who {
    font-size: 14.5px;
    font-weight: 800;
    color: var(--rose);
    margin-bottom: 6px;
  }

  #msg-who.chat {
    color: #8fd3ff;
  }

  #msg-who.guide {
    color: var(--gold);
  }

  #msg-text {
    font-size: 15px;
    line-height: 1.62;
    color: var(--cream);
    white-space: pre-line;
  }

  #msg-choices {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .choice {
    background: #27223b;
    color: var(--cream);
    border: 1px solid #9d86c9;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .choice:hover {
    background: #3b3359;
  }

  #msg-next {
    align-self: flex-end;
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  #title-overlay {
    position: absolute;
    inset: 0;
    background: rgba(11, 9, 17, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 26px 20px;
    z-index: 30;
  }

  #title-overlay h2 {
    margin: 0 0 10px;
    font-size: 26px;
    color: var(--rose);
    font-weight: 800;
  }

  #title-overlay p {
    margin: 0;
    max-width: 560px;
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--muted);
  }

  .start-button {
    margin-top: 22px;
    background: linear-gradient(135deg, #8f4868, #5d3b8c);
    color: var(--cream);
    border: 2px solid #e7b9d4;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 16.5px;
    font-weight: 800;
    cursor: pointer;
  }

  .start-button:hover {
    filter: brightness(1.12);
  }

  .controls {
    margin-top: 13px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 16px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 13px;
    color: var(--muted);
  }

  .controls strong {
    color: var(--cream);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="title-area">
        <span class="tag">TSUKURU ARCHIVE · ~10 MIN</span>
        <h1 class="title">야간 미술관: 밍의 아카이브</h1>
      </div>
      <button type="button" class="reset-btn" id="btn-reset">처음부터</button>
    </header>

    <div class="status-bar">
      <div>장소: <strong id="hud-area">스트리머의 방</strong></div>
      <div>방송: <strong id="hud-live" class="live-pill off">대기 중</strong></div>
      <div>추억 감상: <strong id="hud-mem">0/9</strong> · <strong id="hud-time">00:00</strong></div>
    </div>

    <main class="screen-box">
      <canvas id="scene" width="840" height="480"></canvas>

      <div id="msg-box">
        <div>
          <div id="msg-who">리트밍</div>
          <div id="msg-text"></div>
          <div id="msg-choices"></div>
        </div>
        <div id="msg-next">[SPACE / E / 클릭] 계속</div>
      </div>

      <section id="title-overlay">
        <h2>야간 미술관: 밍의 아카이브</h2>
        <p>
          방에서 일어나 방송을 켠 뒤, 옛날 영상 기록이 이어진 전실과 미술관을<br>
          시청자들과 천천히 걸으며 추억을 되짚는 약 10분 분량의 쯔꾸르 풍 게임입니다.
        </p>
        <button type="button" class="start-button" id="btn-start">눈 뜨기 (START)</button>
      </section>
    </main>

    <footer class="controls">
      <div><strong>이동:</strong> W A S D (방향키 가능)</div>
      <div><strong>빠르게 걷기:</strong> SHIFT</div>
      <div><strong>조사·대화:</strong> SPACE / E / 클릭</div>
    </footer>
  </div>

  <script>
    (function () {
      "use strict";

      const WALK_SPEED = 1.15;
      const RUN_SPEED = 2.25;

      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");
      const titleOverlay = document.getElementById("title-overlay");
      const msgBox = document.getElementById("msg-box");
      const msgWho = document.getElementById("msg-who");
      const msgText = document.getElementById("msg-text");
      const msgChoices = document.getElementById("msg-choices");
      const msgNext = document.getElementById("msg-next");

      let audioCtx = null;
      function playSoftTone(freq, dur, wave, vol) {
        try {
          const AudioCls = window.AudioContext || window.webkitAudioContext;
          if (!AudioCls) return;
          if (!audioCtx) audioCtx = new AudioCls();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = wave || "sine";
          osc.frequency.value = freq;
          gain.gain.value = vol || 0.022;
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + (dur || 0.08));
        } catch (_) {}
      }

      const state = {
        playing: false,
        ended: false,
        room: "bedroom", // "bedroom" | "anteroom" | "gallery"
        liveOn: false,
        startedAt: 0,
        inMsg: false,
        choosing: false,
        queue: [],
        onDone: null,
        running: false,
        seen: {
          r6: false,
          ace: false,
          yakuza: false,
          mabinogi: false,
          apex: false,
          wuthering: false,
          dweller: false,
          redball: false,
          hope: false
        }
      };

      const player = {
        x: 155,
        y: 235,
        w: 24,
        h: 32,
        dir: "down",
        stepPhase: 0
      };

      const keys = {};
      let walls = [];
      let props = [];
      let paintings = [];
      let exitZone = null;

      function seenCount() {
        let n = 0;
        Object.keys(state.seen).forEach(function (k) {
          if (state.seen[k]) n++;
        });
        return n;
      }

      function updateStatus() {
        const areaMap = {
          bedroom: "스트리머의 방",
          anteroom: "초창기 기록 전실",
          gallery: "추억의 회상 미술관"
        };
        document.getElementById("hud-area").textContent = areaMap[state.room] || "스트리머의 방";
        const liveEl = document.getElementById("hud-live");
        if (state.liveOn) {
          liveEl.textContent = "방송 중";
          liveEl.className = "live-pill";
        } else {
          liveEl.textContent = "대기 중";
          liveEl.className = "live-pill off";
        }
        document.getElementById("hud-mem").textContent = seenCount() + "/9";
      }

      function openMessages(list, cb) {
        state.inMsg = true;
        state.running = false;
        state.queue = list.slice();
        state.onDone = cb || null;
        msgBox.style.display = "flex";
        advanceMessage();
      }

      function advanceMessage() {
        if (state.queue.length === 0) {
          state.inMsg = false;
          msgBox.style.display = "none";
          msgChoices.innerHTML = "";
          if (state.onDone) {
            const fn = state.onDone;
            state.onDone = null;
            fn();
          }
          return;
        }

        const item = state.queue.shift();
        const role = item.role || "ritming";
        msgWho.textContent = item.who || "리트밍";
        msgWho.className = role === "chat" ? "chat" : (role === "guide" ? "guide" : "");
        msgText.textContent = item.text;
        msgChoices.innerHTML = "";
        playSoftTone(role === "guide" ? 520 : 380, 0.045, "triangle", 0.022);

        if (item.choices && item.choices.length > 0) {
          state.choosing = true;
          msgNext.style.display = "none";
          item.choices.forEach(function (opt) {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "choice";
            b.textContent = opt.label;
            b.addEventListener("click", function (ev) {
              ev.stopPropagation();
              state.choosing = false;
              msgNext.style.display = "block";
              if (opt.next) {
                state.queue = opt.next.concat(state.queue);
              }
              advanceMessage();
            });
            msgChoices.appendChild(b);
          });
        } else {
          state.choosing = false;
          msgNext.style.display = "block";
        }
      }

      function enterBedroom() {
        state.room = "bedroom";
        updateStatus();
        player.x = 165;
        player.y = 225;
        player.dir = "down";
        exitZone = null;
        paintings = [];

        walls = [
          { x: 0, y: 0, w: 840, h: 72 },
          { x: 0, y: 428, w: 840, h: 52 },
          { x: 0, y: 0, w: 56, h: 480 },
          { x: 784, y: 0, w: 56, h: 480 },
          { x: 95, y: 105, w: 120, h: 72 },
          { x: 280, y: 72, w: 130, h: 36 }
        ];

        props = [
          {
            x: 110, y: 118, w: 90, h: 48, color: "#765898", label: "침대",
            action: function () {
              openMessages([
                { text: "방금 일어난 침대다. 오늘은 옛날 영상 기록부터 하나씩 되짚어 보는 날이다." },
                { text: '리트밍: "자, 이불은 걷었으니 슬슬 오늘 컨셉 세팅해 보자."' }
              ]);
            }
          },
          {
            x: 305, y: 108, w: 72, h: 34, color: "#8c7258", label: "오래된 외장하드·메모",
            action: function () {
              openMessages([
                { text: "초창기 영상과 시리즈 폴더가 정리된 메모가 놓여 있다." },
                { text: '리트밍: "레식·역전재판부터 용과 같이, 마비노기, 에이펙스 레전드, 명조, 그리고 인디 기록까지 다 걸려 있네."' },
                { role: "chat", who: "채팅창", text: "??? : 라인업 보니까 추억이 확 몰려온다\n??? : 시간순 복습 코스가 딱이네" }
              ]);
            }
          },
          {
            x: 565, y: 110, w: 84, h: 42, color: "#4c6b9c", label: "방송 데스크",
            action: function () {
              if (!state.liveOn) {
                openMessages([
                  { text: "모니터 앞에 마이크가 켜질 준비를 마쳤다. 오늘 밤은 옛날 게임 기억이 걸린 공간을 걸어보자." },
                  {
                    text: "방송을 켤까?",
                    choices: [
                      {
                        label: "방송 켜기 (초창기 기록 전실로)",
                        next: [
                          {
                            text: '리트밍: "자~ 다들 어서 오시고! 오늘은 옛날 영상 기록이 이어진 전실을 거쳐 회상 미술관까지 걸어볼 거야."'
                          },
                          {
                            role: "chat",
                            who: "채팅창",
                            text: "??? : 뱅온이다!!\n??? : 이브 느낌 미술관 추억 산책 가보자\n??? : 천천히 다 보고 갈게요"
                          },
                          {
                            text: '리트밍: "오른쪽 문으로 나가면 먼저 [초창기 기록 전실]이 나올 거야. 거기 작품들도 꼭 보고 넘어가자~"'
                          }
                        ]
                      },
                      {
                        label: "조금 더 방 둘러보기",
                        next: [{ text: '리트밍: "응, 천천히 준비되면 다시 눌러줘."' }]
                      }
                    ]
                  }
                ], function () {
                  if (msgText.textContent.indexOf("초창기 기록 전실") !== -1) {
                    state.liveOn = true;
                    updateStatus();
                  }
                });
              } else {
                openMessages([
                  { role: "chat", who: "채팅창", text: "??? : 오른쪽 문 열려 있어요!\n??? : 전실부터 차례대로 구경하자" },
                  { text: '리트밍: "좋아, 오른쪽 문으로 나가자!"' }
                ]);
              }
            }
          },
          {
            x: 735, y: 205, w: 46, h: 90, color: "#8f4868", label: "방 문",
            action: function () {
              if (!state.liveOn) {
                openMessages([
                  { text: "문을 열기 전에 [방송 데스크]에서 방송부터 켜자!" }
                ]);
                return;
              }
              openMessages([
                { text: "문을 열자 차분한 조명의 전실이 이어진다." }
              ], enterAnteroom);
            }
          }
        ];

        openMessages([
          {
            role: "guide",
            who: "안내",
            text: "WASD로 움직일 수 있습니다.\nSHIFT를 눌러 빠르게 움직일 수 있어요.\n(오브젝트·액자 앞에서 SPACE / E 로 조사)"
          },
          {
            text: '리트밍: "여기가 내 방이지. 우선 [방송 데스크]에 가서 방송부터 켜자."'
          }
        ]);
      }

      function enterAnteroom() {
        state.room = "anteroom";
        updateStatus();
        player.x = 76;
        player.y = 225;
        player.dir = "right";
        exitZone = null;

        walls = [
          { x: 0, y: 0, w: 840, h: 72 },
          { x: 0, y: 428, w: 840, h: 52 },
          { x: 0, y: 0, w: 46, h: 480 },
          { x: 794, y: 0, w: 46, h: 480 },
          { x: 385, y: 185, w: 54, h: 110 }
        ];

        props = [
          {
            x: 58, y: 205, w: 34, h: 80, color: "#5c4d7a", label: "방으로 가는 문",
            action: function () {
              openMessages([
                { text: "스트리머의 방으로 돌아간다." }
              ], function () {
                enterBedroom();
                player.x = 695;
                player.y = 235;
                player.dir = "left";
              });
            }
          },
          {
            x: 738, y: 205, w: 46, h: 88, color: "#8f4868", label: "미술관 본관 문",
            action: function () {
              openMessages([
                { text: '리트밍: "전실 기록도 봤으니 이제 [미술관 본관]으로 넘어가서 시리즈 작품들을 더 둘러보자!"' }
              ], enterGallery);
            }
          }
        ];

        paintings = [
          {
            id: "r6",
            x: 185, y: 74, w: 74, h: 44,
            frameColor: "#d9b878",
            artBg: "#1b2130",
            accent: "#72b7ff",
            title: "《전술 브리핑 — 레식》",
            inspect: function () {
              state.seen.r6 = true;
              updateStatus();
              openMessages([
                { text: '작품 제목: 《전술 브리핑》 — 에디션 안내와 스모크 정예 스킨이 그려진 전술 보드다.' },
                { text: '리트밍: "옛날 《레인보우 식스 시즈》 영상 만들 때 생각난다! 에디션 정리하고 스모크 스킨 리뷰하던 시절이 꽤 오래됐지."' },
                {
                  text: "그 시절 기억 중 더 선명한 쪽은?",
                  choices: [
                    {
                      label: "에디션 소개·가이드 만들던 기억",
                      next: [
                        { text: '리트밍: "처음 보는 사람도 헷갈리지 않게 정리하려고 신경 썼던 게 기억나네~"' },
                        { role: "chat", who: "채팅창", text: "??? : 레식 입문 때 그 영상 보고 정했단 사람 많음\n??? : 진짜 추억이다" }
                      ]
                    },
                    {
                      label: "스모크 스킨과 각 재던 실전 기억",
                      next: [
                        { text: '리트밍: "총게임 좋아하면서도 섣불리 들어갔다가 각 걸리던 날들이 생각나네 ㅋㅋ"' },
                        { role: "chat", who: "채팅창", text: "??? : 이때부터 총겜 감성 그대로였음\n??? : 반가운 기록이다" }
                      ]
                    }
                  ]
                }
              ]);
            }
          },
          {
            id: "ace",
            x: 525, y: 74, w: 74, h: 44,
            frameColor: "#d9b878",
            artBg: "#241b2e",
            accent: "#ff85a1",
            title: "《법정의 기록 — 역전재판》",

        state.playing = true;

      function overlaps(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function tryInteract() {
        const pad = 24;
        for (let i = 0; i < paintings.length; i++) {
          const p = paintings[i];
          if (
            player.x - pad < p.x + p.w &&
            player.x + player.w + pad > p.x &&
            player.y - pad < p.y + p.h &&
            player.y + player.h + pad > p.y
          ) {
            p.inspect();
            return;
          }
        }
        for (let i = 0; i < props.length; i++) {
          const pr = props[i];
          if (
            player.x - pad < pr.x + pr.w &&
            player.x + player.w + pad > pr.x &&
            player.y - pad < pr.y + pr.h &&
            player.y + player.h + pad > pr.y
          ) {
            pr.action();
            return;
          }
        }
        if (exitZone) {
          const ez = exitZone;
          if (
            player.x - pad < ez.x + ez.w &&
            player.x + player.w + pad > ez.x &&
            player.y - pad < ez.y + ez.h &&
            player.y + player.h + pad > ez.y
          ) {
            ez.action();
          }
        }
      }

      document.addEventListener("click", function (e) {
        if (!e.target) return;
        if (e.target.id === "btn-start" || e.target.id === "btn-reset") {
          e.preventDefault();
          startNew();
          return;
        }
        if (e.target.closest && e.target.closest("#msg-box")) {
          if (state.inMsg && !state.choosing) {
            advanceMessage();
          }
        }
      });

      window.addEventListener("keydown", function (e) {
        const k = e.key.toLowerCase();
        keys[k] = true;
        if (e.shiftKey) keys["shift"] = true;

        if (!state.playing && (k === "enter" || k === " ")) {
          e.preventDefault();
          startNew();
          return;
        }

        if (k === " " || k === "enter" || k === "e") {
          if (state.inMsg && !state.choosing) {
            e.preventDefault();
            advanceMessage();
          } else if (!state.inMsg && state.playing && !state.ended) {
            e.preventDefault();
            tryInteract();
          }
        }
      });

      window.addEventListener("keyup", function (e) {
        const k = e.key.toLowerCase();
        keys[k] = false;
        if (!e.shiftKey) keys["shift"] = false;
      });

      window.addEventListener("blur", function () {
        Object.keys(keys).forEach(function (key) { keys[key] = false; });
        state.running = false;
      });

      function tick() {
        if (!state.playing || state.ended) return;

        const sec = Math.floor((Date.now() - state.startedAt) / 1000);
        document.getElementById("hud-time").textContent =
          String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");

        if (state.inMsg) {
          state.running = false;
          return;
        }

        let vx = 0;
        let vy = 0;
        if (keys["w"] || keys["arrowup"]) { vy -= 1; player.dir = "up"; }
        if (keys["s"] || keys["arrowdown"]) { vy += 1; player.dir = "down"; }
        if (keys["a"] || keys["arrowleft"]) { vx -= 1; player.dir = "left"; }
        if (keys["d"] || keys["arrowright"]) { vx += 1; player.dir = "right"; }

        const moving = vx !== 0 || vy !== 0;
        state.running = Boolean(keys["shift"] && moving);
        const spd = state.running ? RUN_SPEED : WALK_SPEED;

        if (vx !== 0 && vy !== 0) {
          const inv = 0.7071;
          vx *= inv;
          vy *= inv;
        }

        const dx = vx * spd;
        const dy = vy * spd;

        player.x += dx;
        for (let i = 0; i < walls.length; i++) {
          if (overlaps(player, walls[i])) player.x -= dx;
        }

        player.y += dy;
        for (let i = 0; i < walls.length; i++) {
          if (overlaps(player, walls[i])) player.y -= dy;
        }

        if (moving) {
          player.stepPhase += state.running ? 0.24 : 0.14;
        } else {
          player.stepPhase = 0;
        }
      }

      function render() {
        ctx.fillStyle = "#110f1b";
        ctx.fillRect(0, 0, 840, 480);

        const floorColor =
          state.room === "bedroom" ? "#1c182b" :
          (state.room === "anteroom" ? "#171424" : "#151221");
        ctx.fillStyle = floorColor;
        ctx.fillRect(46, 72, 748, 356);

        ctx.strokeStyle = "#241f36";
        for (let x = 46; x < 794; x += 28) {
          ctx.beginPath();
          ctx.moveTo(x, 72);
          ctx.lineTo(x, 428);
          ctx.stroke();
        }
        for (let y = 72; y < 428; y += 28) {
          ctx.beginPath();
          ctx.moveTo(46, y);
          ctx.lineTo(794, y);
          ctx.stroke();
        }

        ctx.fillStyle = "#2b2440";
        ctx.fillRect(0, 0, 840, 72);
        ctx.fillStyle = "#433a63";
        ctx.fillRect(0, 68, 840, 4);

        for (let i = 0; i < walls.length; i++) {
          const w = walls[i];
          if (w.y >= 72 && w.y < 428 && w.x > 50 && w.x < 780) {
            ctx.fillStyle = "#362e52";
            ctx.fillRect(w.x, w.y, w.w, w.h);
            ctx.strokeStyle = "#62548f";
            ctx.strokeRect(w.x, w.y, w.w, w.h);
          }
        }

        ctx.textAlign = "center";
        ctx.font = "bold 12px sans-serif";

        for (let i = 0; i < paintings.length; i++) {
          const p = paintings[i];
          const visited = state.seen[p.id];
          ctx.fillStyle = p.frameColor;
          ctx.fillRect(p.x - 4, p.y - 4, p.w + 8, p.h + 8);
          ctx.fillStyle = p.artBg;
          ctx.fillRect(p.x, p.y, p.w, p.h);

          ctx.fillStyle = p.accent;
          ctx.beginPath();
          ctx.arc(p.x + p.w * 0.5, p.y + p.h * 0.52, 8, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = visited ? "#d4c7f2" : "#fff2b2";
          ctx.fillText(p.title + (visited ? " ✓" : ""), p.x + p.w / 2, p.y + p.h + 17);
        }

        for (let i = 0; i < props.length; i++) {
          const pr = props[i];
          ctx.fillStyle = pr.color;
          ctx.fillRect(pr.x, pr.y, pr.w, pr.h);
          ctx.strokeStyle = "#b8a8de";
          ctx.strokeRect(pr.x, pr.y, pr.w, pr.h);
          ctx.fillStyle = "#f6efe9";
          ctx.fillText(pr.label, pr.x + pr.w / 2, pr.y - 7);
        }

        if (exitZone) {
          ctx.fillStyle = "#4d386b";
          ctx.fillRect(exitZone.x, exitZone.y, exitZone.w, exitZone.h);
          ctx.strokeStyle = "#d9b878";
          ctx.strokeRect(exitZone.x, exitZone.y, exitZone.w, exitZone.h);
          ctx.fillStyle = "#f6efe9";
          ctx.fillText(exitZone.label, exitZone.x + exitZone.w / 2, exitZone.y - 7);
        }

        const bob = Math.sin(player.stepPhase) * 2.2;
        const px = Math.round(player.x);
        const py = Math.round(player.y + bob);

        ctx.fillStyle = "#3b2336";
        ctx.fillRect(px + 5, py + 23, 14, 4);
        ctx.fillStyle = "#241926";
        ctx.fillRect(px + 4, py + 27, 6, 5);
        ctx.fillRect(px + 14, py + 27, 6, 5);

        ctx.fillStyle = state.liveOn ? "#e89ac7" : "#b9a7e6";
        ctx.fillRect(px + 5, py + 14, 14, 10);

        ctx.fillStyle = "#ffe5d4";
        ctx.fillRect(px + 5, py + 4, 14, 11);

        ctx.fillStyle = "#d99b78";
        ctx.fillRect(px + 4, py + 1, 16, 5);
        ctx.fillRect(px + 3, py + 4, 3, 8);
        ctx.fillRect(px + 18, py + 4, 3, 8);

        ctx.fillStyle = "#23192d";
        if (player.dir !== "up") {
          const eyeShift = player.dir === "left" ? -2 : (player.dir === "right" ? 2 : 0);
          ctx.fillRect(px + 7 + eyeShift, py + 9, 2.5, 4);
          ctx.fillRect(px + 14 + eyeShift, py + 9, 2.5, 4);
        }

        if (state.running) {
          ctx.fillStyle = "#e89ac7";
          ctx.font = "bold 11px sans-serif";
          ctx.fillText("빠른 걸음", px + player.w / 2, py + player.h + 15);
        }
      }

      function loop() {
        tick();
        render();
        requestAnimationFrame(loop);
      }

      updateStatus();
      loop();
    })();
  </script>
</body>
</html>
