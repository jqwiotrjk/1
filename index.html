<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지스타 가는 길: 밍의 이세계 미술관</title>
<style>
  :root {
    --bg: #09080e;
    --panel: #14121e;
    --panel-2: #1d192b;
    --border: #433a63;
    --rose: #f09fd0;
    --cream: #f7f0ea;
    --muted: #b3a7cf;
    --gold: #ecc66d;
  }

  * {
    box-sizing: border-box;
    user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 18% 12%, rgba(164, 86, 134, 0.2), transparent 45%),
      radial-gradient(circle at 82% 88%, rgba(88, 72, 148, 0.2), transparent 46%),
      var(--bg);
    color: var(--cream);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }

  .wrap {
    max-width: 940px;
    margin: 0 auto;
    padding: 18px 14px 36px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    background: var(--panel);
    border: 2px solid var(--border);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    padding: 13px 18px;
  }

  .title-area {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 0.4px;
    color: var(--rose);
    background: rgba(240, 159, 208, 0.14);
    border: 1px solid rgba(240, 159, 208, 0.42);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .title {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
  }

  .btn-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sub-btn {
    background: var(--panel-2);
    color: var(--cream);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .sub-btn:hover {
    border-color: var(--rose);
    background: #2b2540;
  }

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    background: var(--panel-2);
    border-left: 2px solid var(--border);
    border-right: 2px solid var(--border);
    padding: 9px 18px;
    font-size: 13.5px;
    color: var(--muted);
    font-weight: 700;
  }

  .status-bar strong {
    color: var(--cream);
  }

  .live-pill {
    color: #ff82a4;
  }

  .live-pill.off {
    color: var(--muted);
  }

  .screen-box {
    position: relative;
    background: #0e0c16;
    border: 2px solid var(--border);
    border-radius: 0 0 10px 10px;
    overflow: hidden;
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.65);
  }

  #scene {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
  }

  #msg-box {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 18px;
    min-height: 142px;
    background: rgba(13, 11, 21, 0.97);
    border: 2px solid #a38bd1;
    border-radius: 7px;
    padding: 15px 19px;
    display: none;
    flex-direction: column;
    justify-content: space-between;
    z-index: 20;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
  }

  #msg-who {
    font-size: 14.5px;
    font-weight: 800;
    color: var(--rose);
    margin-bottom: 6px;
  }

  #msg-who.chat {
    color: #93d6ff;
  }

  #msg-who.guide {
    color: var(--gold);
  }

  #msg-who.cat {
    color: #c8a2ff;
  }

  #msg-text {
    font-size: 15px;
    line-height: 1.65;
    color: var(--cream);
    white-space: pre-line;
  }

  #msg-choices {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 11px;
  }

  .choice {
    background: #27213c;
    color: var(--cream);
    border: 1px solid #a38bd1;
    border-radius: 6px;
    padding: 7px 13px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .choice:hover, .choice.selected {
    background: #3d335e;
    border-color: var(--rose);
  }

  #msg-next {
    align-self: flex-end;
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  #title-overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 8, 16, 0.96);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 28px 22px;
    z-index: 30;
  }

  #title-overlay h2 {
    margin: 0 0 10px;
    font-size: 27px;
    color: var(--rose);
    font-weight: 800;
  }

  #title-overlay p {
    margin: 0;
    max-width: 600px;
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--muted);
  }

  .start-button {
    margin-top: 22px;
    background: linear-gradient(135deg, #984b70, #5d3b8c);
    color: var(--cream);
    border: 2px solid #ecc0dc;
    border-radius: 8px;
    padding: 12px 30px;
    font-size: 16.5px;
    font-weight: 800;
    cursor: pointer;
  }

  .start-button:hover {
    filter: brightness(1.12);
  }

  .controls {
    margin-top: 13px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 16px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 13px;
    color: var(--muted);
  }

  .controls strong {
    color: var(--cream);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="title-area">
        <span class="tag">RITMING FAN ARCHIVE · G-STAR TO MUSEUM</span>
        <h1 class="title">지스타 가는 길: 밍의 이세계 미술관</h1>
      </div>
      <div class="btn-group">
        <button type="button" class="sub-btn" id="btn-sound">🔊 효과음 ON</button>
        <button type="button" class="sub-btn" id="btn-reset">처음부터</button>
      </div>
    </header>

    <div class="status-bar">
      <div>장소: <strong id="hud-area">스트리머의 방</strong></div>
      <div>방송: <strong id="hud-live" class="live-pill off">대기 중</strong></div>
      <div>추억 감상: <strong id="hud-mem">0/9</strong> · <strong id="hud-time">00:00</strong></div>
    </div>

    <main class="screen-box">
      <canvas id="scene" width="840" height="480"></canvas>

      <div id="msg-box">
        <div>
          <div id="msg-who">리트밍</div>
          <div id="msg-text"></div>
          <div id="msg-choices"></div>
        </div>
        <div id="msg-next">[Z / ENTER / 클릭] 계속 · [X] 취소</div>
      </div>

      <section id="title-overlay">
        <h2>지스타 가는 길: 밍의 이세계 미술관</h2>
        <p>
          침대에서 일어나 컴퓨터로 방송을 켜고, 지스타로 향하던 길목에서<br>
          수상한 고양이를 만나 이세계의 추억 미술관으로 건너가는 팬 게임입니다.
        </p>
        <button type="button" class="start-button" id="btn-start">침대에서 일어나기 (Z / 클릭)</button>
      </section>
    </main>

    <footer class="controls">
      <div><strong>이동:</strong> 방향키 (↑ ↓ ← →)</div>
      <div><strong>달리기:</strong> SHIFT</div>
      <div><strong>조사·확인:</strong> Z / ENTER</div>
      <div><strong>취소:</strong> X / ESC</div>
    </footer>
  </div>

  <script>
    (function () {
      "use strict";

      const WALK_SPEED = 1.25;
      const RUN_SPEED = 2.35;

      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");
      const titleOverlay = document.getElementById("title-overlay");
      const msgBox = document.getElementById("msg-box");
      const msgWho = document.getElementById("msg-who");
      const msgText = document.getElementById("msg-text");
      const msgChoices = document.getElementById("msg-choices");
      const msgNext = document.getElementById("msg-next");
      const soundBtn = document.getElementById("btn-sound");

      let soundEnabled = true;
      let audioCtx = null;

      function playTone(freq, dur, wave, vol) {
        if (!soundEnabled) return;
        try {
          const AudioCls = window.AudioContext || window.webkitAudioContext;
          if (!AudioCls) return;
          if (!audioCtx) audioCtx = new AudioCls();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = wave || "sine";
          osc.frequency.value = freq;
          gain.gain.value = vol || 0.022;
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + (dur || 0.08));
        } catch (_) {}
      }

      const state = {
        playing: false,
        ended: false,
        room: "bedroom", // bedroom | road | museum
        liveOn: false,
        warpedToMuseum: false,
        startedAt: 0,
        inMsg: false,
        choosing: false,
        choiceIndex: 0,
        queue: [],
        onDone: null,
        running: false,
        fadeAlpha: 0,
        fadeTarget: 0,
        fadeCallback: null,
        shakeTimer: 0,
        animTick: 0,
        seen: {
          r6: false,
          ace: false,
          yakuza: false,
          mabinogi: false,
          apex: false,
          wuthering: false,
          dweller: false,
          redball: false,
          hope: false
        }
      };

      const player = {
        x: 155,
        y: 230,
        w: 24,
        h: 32,
        dir: "down",
        stepPhase: 0
      };

      const keys = {};
      let walls = [];
      let props = [];
      let paintings = [];
      let exitZone = null;

      function seenCount() {
        return Object.values(state.seen).filter(Boolean).length;
      }

      function updateStatus() {
        const areaMap = {
          bedroom: "스트리머의 방",
          road: "지스타 가는 길",
          museum: "이세계 추억 미술관"
        };
        document.getElementById("hud-area").textContent = areaMap[state.room] || "스트리머의 방";
        const liveEl = document.getElementById("hud-live");
        if (state.liveOn) {
          liveEl.textContent = "방송 중";
          liveEl.className = "live-pill";
        } else {
          liveEl.textContent = "대기 중";
          liveEl.className = "live-pill off";
        }
        document.getElementById("hud-mem").textContent = seenCount() + "/9";
      }

      function transitionRoom(fn, shake) {
        if (state.fadeTarget === 1) return;
        if (shake) state.shakeTimer = 24;
        state.fadeTarget = 1;
        state.fadeCallback = function () {
          fn();
          state.fadeTarget = 0;
          state.fadeCallback = null;
        };
      }

      function closeMessageImmediately() {
        state.inMsg = false;
        state.choosing = false;
        state.queue = [];
        state.onDone = null;
        msgBox.style.display = "none";
        msgChoices.innerHTML = "";
        playTone(280, 0.05, "triangle", 0.02);
      }

      function openMessages(list, cb) {
        state.inMsg = true;
        state.running = false;
        state.queue = list.slice();
        state.onDone = cb || null;
        msgBox.style.display = "flex";
        advanceMessage();
      }

      function refreshChoiceHighlight() {
        const btns = msgChoices.querySelectorAll(".choice");
        btns.forEach(function (b, idx) {
          if (idx === state.choiceIndex) b.classList.add("selected");
          else b.classList.remove("selected");
        });
      }

      function advanceMessage() {
        if (state.choosing) {
          const btns = msgChoices.querySelectorAll(".choice");
          if (btns[state.choiceIndex]) btns[state.choiceIndex].click();
          return;
        }

        if (state.queue.length === 0) {
          state.inMsg = false;
          msgBox.style.display = "none";
          msgChoices.innerHTML = "";
          if (state.onDone) {
            const fn = state.onDone;
            state.onDone = null;
            fn();
          }
          return;
        }

        const item = state.queue.shift();
        const role = item.role || "ritming";
        msgWho.textContent = item.who || "리트밍";
        msgWho.className =
          role === "chat" ? "chat" :
          role === "guide" ? "guide" :
          role === "cat" ? "cat" : "";
        msgText.textContent = item.text;
        msgChoices.innerHTML = "";
        state.choiceIndex = 0;

        playTone(role === "cat" ? 660 : role === "guide" ? 520 : 400, 0.05, "triangle", 0.022);

        if (item.choices && item.choices.length > 0) {
          state.choosing = true;
          msgNext.textContent = "[↑ ↓] 선택 · [Z / ENTER] 결정 · [X] 취소";
          item.choices.forEach(function (opt, idx) {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "choice" + (idx === 0 ? " selected" : "");
            b.textContent = opt.label;
            b.addEventListener("mouseenter", function () {
              state.choiceIndex = idx;
              refreshChoiceHighlight();
            });
            b.addEventListener("click", function (ev) {
              ev.stopPropagation();
              state.choosing = false;
              msgNext.textContent = "[Z / ENTER / 클릭] 계속 · [X] 취소";
              if (opt.next) {
                state.queue = opt.next.concat(state.queue);
              }
              advanceMessage();
            });
            msgChoices.appendChild(b);
          });
        } else {
          state.choosing = false;
          msgNext.textContent = "[Z / ENTER / 클릭] 계속 · [X] 닫기";
        }
      }

      function enterBedroom(fromRoad) {
        state.room = "bedroom";
        updateStatus();
        paintings = [];
        exitZone = null;

        if (fromRoad) {
          player.x = 695;
          player.y = 232;
          player.dir = "left";
        } else {
          player.x = 165;
          player.y = 225;
          player.dir = "down";
        }

        walls = [
          { x: 0, y: 0, w: 840, h: 72 },
          { x: 0, y: 428, w: 840, h: 52 },
          { x: 0, y: 0, w: 56, h: 480 },
          { x: 784, y: 0, w: 56, h: 480 },
          { x: 95, y: 105, w: 120, h: 72 },
          { x: 545, y: 98, w: 120, h: 56 }
        ];

        props = [
          {
            x: 110, y: 118, w: 90, h: 48, color: "#785a9e", label: "침대",
            action: function () {
              openMessages([
                { text: "방금 일어난 침대다. 오늘은 지스타에 가기 전에 잠시 컴퓨터로 방송부터 켜두고 출발하자." },
                { text: '리트밍: "침대에서 일어나자마자 지스타 생각부터 나네. [컴퓨터]로 방송 먼저 켜볼까?"' }
              ]);
            }
          },
          {
            x: 562, y: 104, w: 86, h: 44, color: "#4e6fa3", label: "컴퓨터 (방송)",
            action: function () {
              if (!state.liveOn) {
                openMessages([
                  { text: "방 안의 컴퓨터 모니터가 켜져 있다. 방송 세팅과 지스타 이동 준비가 올라와 있다." },
                  {
                    text: "컴퓨터로 방송을 켤까?",
                    choices: [
                      {
                        label: "방송 켜기! (지스타 가는 길 준비)",
                        next: [
                          { text: '리트밍: "자~ 다들 어서 오시고! 오늘 지스타 가는 길부터 뱅온하고 출발해 볼게!"' },
                          { role: "chat", who: "채팅창", text: "??? : 아침/출발 뱅온이다!!\n??? : 지스타 가는 길 조심해서 가세요\n??? : 3D 멀미 조심하면서 가자 ㅋㅋ" },
                          { text: '리트밍: "이제 오른쪽 [현관문]을 통해 밖으로 나가보자!"' }
                        ]
                      },
                      {
                        label: "조금 더 있다가 켜기 (X)",
                        next: [{ text: '리트밍: "응, 준비되면 언제든 다시 컴퓨터를 조사해 줘."' }]
                      }
                    ]
                  }
                ], function () {
                  if (msgText.textContent.indexOf("오른쪽 [현관문]") !== -1) {
                    state.liveOn = true;
                    updateStatus();
                  }
                });
              } else {
                openMessages([
                  { role: "chat", who: "채팅창", text: "??? : 방송 켜졌어요! 현관문으로 나가면 되나요?\n??? : 길 가면서 조심해~" },
                  { text: '리트밍: "응, 방송 켜뒀으니까 오른쪽 현관문으로 나가서 지스타 가는 길로 가자!"' }
                ]);
              }
            }
          },
          {
            x: 735, y: 205, w: 46, h: 90, color: "#964b6e", label: "현관문",
            action: function () {
              if (!state.liveOn) {
                openMessages([
                  { text: '리트밍: "잠깐, 나가기 전에 방 안 [컴퓨터]로 방송부터 켜고 가자!"' }
                ]);
                return;
              }
              transitionRoom(function () {
                enterRoad();
                openMessages([
                  { text: "현관문을 열고 밖으로 나섰다. 지스타로 향하는 길이 뻗어 있다." },
                  { text: '리트밍: "좋아, 이 길 따라가면 되겠지? 어, 앞쪽에 뭔가 보이는 것 같은데..."' }
                ]);
              }, false);
            }
          }
        ];

        if (!fromRoad) {
          openMessages([
            {
              role: "guide",
              who: "조작 안내",
              text: "방향키: 이동 · SHIFT: 달리기\nZ / ENTER: 조사 및 대화 확인 · X: 취소/닫기"
            },
            {
              text: "핑크색 머리에 연보라색 옷을 입은 스트리머가 침대에서 일어났다."
            },
            {
              text: '리트밍: "일어났어! 지스타 가기 전에 먼저 [컴퓨터]로 방송부터 켜자."'
            }
          ]);
        }
      }

      function enterRoad() {
        state.room = "road";
        updateStatus();
        player.x = 85;
        player.y = 235;
        player.dir = "right";
        paintings = [];
        exitZone = null;

        walls = [
          { x: 0, y: 0, w: 840, h: 72 },
          { x: 0, y: 428, w: 840, h: 52 },
          { x: 0, y: 0, w: 46, h: 480 },
          { x: 794, y: 0, w: 46, h: 480 }
        ];

        props = [
          {
            x: 54, y: 205, w: 32, h: 80, color: "#5e4e7e", label: "방으로 돌아가기",
            action: function () {
              transitionRoom(function () {
                enterBedroom(true);
              }, false);
            }
          },
          {
            x: 525, y: 215, w: 44, h: 38, color: "#b68cff", label: "수상한 고양이",
            action: function () {
              openMessages([
                { role: "cat", who: "수상한 고양이", text: "야옹...? 지스타로 가는 길목에서 이상한 빛과 소리가 들려온다." },
                { text: '리트밍: "어? 길 한가운데에 웬 고양이가... 왜 이렇게 눈이 반짝이지?"' },
                {
                  text: "수상한 고양이에게 말을 걸어볼까?",
                  choices: [
                    {
                      label: "고양이에게 말을 건다 (Z)",
                      next: [
                        { role: "cat", who: "수상한 고양이", text: "냐옹! 어지러운 균열과 함께 길의 경계가 흔들린다...!" },
                        { text: '리트밍: "어?! 잠깐만, 갑자기 발밑이 흔들리면서 화면이 돌—"' },
                        { role: "chat", who: "채팅창", text: "??? : 어? 방금 뭐가 지나갔어?\n??? : 이세계 전이 실화냐고 ㅋㅋ" }
                      ]
                    },
                    {
                      label: "한 걸음 물러난다 (X)",
                      next: [{ text: '리트밍: "흠, 조금 수상하긴 한데… 그래도 궁금하니까 다시 다가가 보자."' }]
                    }
                  ]

          r6: false, ace: false, yakuza: false, mabinogi: false,
          apex: false, wuthering: false, dweller: false, redball: false, hope: false

      function overlaps(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function isNear(a, b, pad) {
        return (
          a.x - pad < b.x + b.w &&
          a.x + a.w + pad > b.x &&
          a.y - pad < b.y + b.h &&
          a.y + a.h + pad > b.y
        );
      }

      function tryInteract() {
        const pad = 26;
        for (let i = 0; i < paintings.length; i++) {
          if (isNear(player, paintings[i], pad)) {
            paintings[i].inspect();
            return;
          }
        }
        for (let i = 0; i < props.length; i++) {
          if (isNear(player, props[i], pad)) {
            props[i].action();
            return;
          }
        }
        if (exitZone && isNear(player, exitZone, pad)) {
          exitZone.action();
        }
      }

      soundBtn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? "🔊 효과음 ON" : "🔇 효과음 OFF";
      });

      document.addEventListener("click", function (e) {
        if (!e.target) return;
        if (e.target.id === "btn-start" || e.target.id === "btn-reset") {
          e.preventDefault();
          startNew();
          return;
        }
        if (e.target.closest && e.target.closest("#msg-box")) {
          if (state.inMsg && !state.choosing) {
            advanceMessage();
          }
        }
      });

      window.addEventListener("keydown", function (e) {
        const k = e.key.toLowerCase();
        keys[k] = true;
        if (e.shiftKey) keys["shift"] = true;

        if (!state.playing && (k === "z" || k === "enter" || k === " ")) {
          e.preventDefault();
          startNew();
          return;
        }

        if (state.inMsg) {
          if (k === "x" || k === "escape") {
            e.preventDefault();
            closeMessageImmediately();
            return;
          }
          if (state.choosing && (k === "arrowup" || k === "arrowdown")) {
            e.preventDefault();
            const btns = msgChoices.querySelectorAll(".choice");
            if (btns.length > 0) {
              state.choiceIndex =
                k === "arrowdown"
                  ? (state.choiceIndex + 1) % btns.length
                  : (state.choiceIndex - 1 + btns.length) % btns.length;
              refreshChoiceHighlight();
            }
            return;
          }
          if (k === "z" || k === "enter" || k === " ") {
            e.preventDefault();
            advanceMessage();
          }
          return;
        }

        if (state.playing && !state.ended && state.fadeTarget === 0) {
          if (k === "z" || k === "enter" || k === " ") {
            e.preventDefault();
            tryInteract();
          }
        }
      });

      window.addEventListener("keyup", function (e) {
        const k = e.key.toLowerCase();
        keys[k] = false;
        if (!e.shiftKey) keys["shift"] = false;
      });

      window.addEventListener("blur", function () {
        Object.keys(keys).forEach(function (key) { keys[key] = false; });
        state.running = false;
      });

      function tick() {
        state.animTick += 0.04;
        if (state.shakeTimer > 0) state.shakeTimer--;

        if (state.fadeTarget === 1) {
          state.fadeAlpha = Math.min(1, state.fadeAlpha + 0.07);
          if (state.fadeAlpha >= 1 && state.fadeCallback) {
            const cb = state.fadeCallback;
            state.fadeCallback = null;
            cb();
          }
          return;
        } else if (state.fadeAlpha > 0) {
          state.fadeAlpha = Math.max(0, state.fadeAlpha - 0.07);
        }

        if (!state.playing || state.ended) return;

        const sec = Math.floor((Date.now() - state.startedAt) / 1000);
        document.getElementById("hud-time").textContent =
          String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");

        if (state.inMsg) {
          state.running = false;
          return;
        }

        let vx = 0;
        let vy = 0;
        if (keys["arrowup"]) { vy -= 1; player.dir = "up"; }
        if (keys["arrowdown"]) { vy += 1; player.dir = "down"; }
        if (keys["arrowleft"]) { vx -= 1; player.dir = "left"; }
        if (keys["arrowright"]) { vx += 1; player.dir = "right"; }

        const moving = vx !== 0 || vy !== 0;
        state.running = Boolean(keys["shift"] && moving);
        const spd = state.running ? RUN_SPEED : WALK_SPEED;

        if (vx !== 0 && vy !== 0) {
          vx *= 0.7071;
          vy *= 0.7071;
        }

        const dx = vx * spd;
        const dy = vy * spd;

        player.x += dx;
        for (let i = 0; i < walls.length; i++) {
          if (overlaps(player, walls[i])) player.x -= dx;
        }

        player.y += dy;
        for (let i = 0; i < walls.length; i++) {
          if (overlaps(player, walls[i])) player.y -= dy;
        }

        if (moving) {
          player.stepPhase += state.running ? 0.24 : 0.14;
        } else {
          player.stepPhase = 0;
        }
      }

      function render() {
        ctx.save();
        if (state.shakeTimer > 0) {
          const mag = Math.ceil(state.shakeTimer * 0.25);
          ctx.translate((Math.random() - 0.5) * mag * 2, (Math.random() - 0.5) * mag * 2);
        }

        ctx.fillStyle = "#0e0c16";
        ctx.fillRect(0, 0, 840, 480);

        const floorColor =
          state.room === "bedroom" ? "#1c182c" :
          state.room === "road" ? "#192229" : "#141121";
        ctx.fillStyle = floorColor;
        ctx.fillRect(46, 72, 748, 356);

        ctx.strokeStyle = state.room === "road" ? "#24333d" : "#241f38";
        for (let x = 46; x < 794; x += 28) {
          ctx.beginPath();
          ctx.moveTo(x, 72);
          ctx.lineTo(x, 428);
          ctx.stroke();
        }
        for (let y = 72; y < 428; y += 28) {
          ctx.beginPath();
          ctx.moveTo(46, y);
          ctx.lineTo(794, y);
          ctx.stroke();
        }

        if (state.room === "road") {
          ctx.fillStyle = "#2b323d";
          ctx.fillRect(46, 195, 748, 90);
          ctx.strokeStyle = "#ecc66d";
          ctx.setLineDash([12, 10]);
          ctx.beginPath();
          ctx.moveTo(50, 240);
          ctx.lineTo(790, 240);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        ctx.fillStyle = "#2b2442";
        ctx.fillRect(0, 0, 840, 72);
        ctx.fillStyle = "#483d6b";
        ctx.fillRect(0, 68, 840, 4);

        for (let i = 0; i < walls.length; i++) {
          const w = walls[i];
          if (w.y >= 72 && w.y < 428 && w.x > 50 && w.x < 780) {
            ctx.fillStyle = "#362e54";
            ctx.fillRect(w.x, w.y, w.w, w.h);
            ctx.strokeStyle = "#695999";
            ctx.strokeRect(w.x, w.y, w.w, w.h);
          }
        }

        ctx.textAlign = "center";
        ctx.font = "bold 12px sans-serif";

        for (let i = 0; i < paintings.length; i++) {
          const p = paintings[i];
          const visited = state.seen[p.id];
          const near = state.playing && !state.inMsg && isNear(player, p, 26);

          const glow = ctx.createRadialGradient(
            p.x + p.w / 2, p.y + p.h / 2, 4,
            p.x + p.w / 2, p.y + p.h / 2, 64
          );
          glow.addColorStop(0, "rgba(236, 198, 109, 0.16)");
          glow.addColorStop(1, "rgba(236, 198, 109, 0)");
          ctx.fillStyle = glow;
          ctx.fillRect(p.x - 28, p.y - 24, p.w + 56, p.h + 52);

          ctx.fillStyle = p.frameColor;
          ctx.fillRect(p.x - 4, p.y - 4, p.w + 8, p.h + 8);
          ctx.fillStyle = p.artBg;
          ctx.fillRect(p.x, p.y, p.w, p.h);

          const pulse = 7 + Math.sin(state.animTick * 2 + i) * 1.3;
          ctx.fillStyle = p.accent;
          ctx.beginPath();
          ctx.arc(p.x + p.w * 0.5, p.y + p.h * 0.52, pulse, 0, Math.PI * 2);
          ctx.fill();

          if (near) {
            ctx.strokeStyle = "#f7f0ea";
            ctx.strokeRect(p.x - 7, p.y - 7, p.w + 14, p.h + 14);
          }

          ctx.fillStyle = visited ? "#d7c9f5" : "#fff1b0";
          ctx.fillText(p.title + (visited ? " ✓" : ""), p.x + p.w / 2, p.y + p.h + 17);
        }

        for (let i = 0; i < props.length; i++) {
          const pr = props[i];
          const near = state.playing && !state.inMsg && isNear(player, pr, 26);
          ctx.fillStyle = pr.color;
          ctx.fillRect(pr.x, pr.y, pr.w, pr.h);
          ctx.strokeStyle = near ? "#f7f0ea" : "#b8a8de";
          ctx.strokeRect(pr.x, pr.y, pr.w, pr.h);
          ctx.fillStyle = "#f7f0ea";
          ctx.fillText(pr.label, pr.x + pr.w / 2, pr.y - 7);
        }

        if (exitZone) {
          const near = state.playing && !state.inMsg && isNear(player, exitZone, 26);
          ctx.fillStyle = "#4d386b";
          ctx.fillRect(exitZone.x, exitZone.y, exitZone.w, exitZone.h);
          ctx.strokeStyle = near ? "#f7f0ea" : "#dfb976";
          ctx.strokeRect(exitZone.x, exitZone.y, exitZone.w, exitZone.h);
          ctx.fillStyle = "#f7f0ea";
          ctx.fillText(exitZone.label, exitZone.x + exitZone.w / 2, exitZone.y - 7);
        }

        // 캐릭터 (핑크색 머리 + 연보라색 옷)
        const bob = Math.sin(player.stepPhase) * 2.2;
        const px = Math.round(player.x);
        const py = Math.round(player.y + bob);

        ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
        ctx.beginPath();
        ctx.ellipse(px + 12, Math.round(player.y) + 32, 10, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#4b3869";
        ctx.fillRect(px + 5, py + 23, 14, 4);
        ctx.fillStyle = "#2b203d";
        ctx.fillRect(px + 4, py + 27, 6, 5);
        ctx.fillRect(px + 14, py + 27, 6, 5);

        // 연보라색 상의/몸통
        ctx.fillStyle = "#b8a2eb";
        ctx.fillRect(px + 5, py + 14, 14, 10);

        ctx.fillStyle = "#ffe6d6";
        ctx.fillRect(px + 5, py + 4, 14, 11);

        // 핑크색 헤어
        ctx.fillStyle = "#f39ac8";
        ctx.fillRect(px + 4, py + 1, 16, 5);
        ctx.fillRect(px + 3, py + 4, 3, 8);
        ctx.fillRect(px + 18, py + 4, 3, 8);

        ctx.fillStyle = "#23192d";
        if (player.dir !== "up") {
          const eyeShift = player.dir === "left" ? -2 : (player.dir === "right" ? 2 : 0);
          ctx.fillRect(px + 7 + eyeShift, py + 9, 2.5, 4);
          ctx.fillRect(px + 14 + eyeShift, py + 9, 2.5, 4);
        }

        if (state.running) {
          ctx.fillStyle = "#f09fd0";
          ctx.font = "bold 11px sans-serif";
          ctx.fillText("달리기 중", px + player.w / 2, py + player.h + 15);
        }

        if (state.fadeAlpha > 0) {
          ctx.fillStyle = "rgba(9, 8, 14, " + state.fadeAlpha.toFixed(3) + ")";
          ctx.fillRect(0, 0, 840, 480);
        }

        ctx.restore();
      }

      function loop() {
        tick();
        render();
        requestAnimationFrame(loop);
      }

      updateStatus();
      loop();
    })();
  </script>
</body>
</html>
